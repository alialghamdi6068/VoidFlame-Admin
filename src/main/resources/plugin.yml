name: VoidFlame-Admin
version: 1.0.0
main: net.voidflame.menus.VoidFlameMenusPlugin
description: Unified VoidFlame administration, staff controls and menu framework.
author: VoidFlame
website: https://github.com/alialghamdi6068/VoidFlame-Admin
api-version: '26.2'
load: POSTWORLD
softdepend: [VoidFlame-Core, VoidFlame-Kits, VoidFlame-Arenas, VoidFlame-Ranks, VoidFlame-Duels, VoidFlame-Security, VoidFlame-Logs]

commands:
  vfadmin:
    description: Open the unified VoidFlame administration panel.
    usage: /vfadmin
    permission: voidflame.admin
  staff:
    description: Open the VoidFlame staff control panel.
    usage: /staff
    permission: voidflame.staff
  staffgui:
    description: Open the VoidFlame staff control panel.
    usage: /staffgui
    permission: voidflame.staff

permissions:
  voidflame.admin:
    description: Unified VoidFlame administration access.
    default: op
  voidflame.staff:
    description: Staff control access.
    default: op
  voidflame.staff.players:
    description: Staff player management access.
    default: op
  voidflame.staff.server:
    description: Staff server management access.
    default: op
  voidflame.staff.world:
    description: Staff world management access.
    default: op
  voidflame.staff.admin:
    description: Staff advanced administration access.
    default: op
