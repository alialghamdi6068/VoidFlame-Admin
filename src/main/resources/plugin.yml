name: VoidFlame-Admin
version: 1.0.0
main: net.voidflame.menus.VoidFlameMenusPlugin
description: Unified VoidFlame administration, staff controls, server metrics and audit logging.
author: VoidFlame
website: https://github.com/alialghamdi6068/VoidFlame-Admin
api-version: '26.2'
load: POSTWORLD
softdepend: [VoidFlame-Core, VoidFlame-Kits, VoidFlame-Arenas, VoidFlame-Duels, VoidFlame-Security, ZonePracticePro]

commands:
  vfadmin:
    description: Open the unified VoidFlame administration panel.
    usage: /vfadmin [performance|punish|reload]
  staff:
    description: Open the VoidFlame staff control panel.
    usage: /staff
    permission: voidflame.staff
  staffgui:
    description: Open the VoidFlame staff control panel.
    usage: /staffgui
    permission: voidflame.staff

permissions:
  voidflame.admin:
    description: Open the central VoidFlame administration console and status tools.
    default: op
  voidflame.admin.full:
    description: Full unrestricted access to the central administration console.
    default: false
  voidflame.admin.duels:
    description: Manage the installed duels/practice system.
    default: false
  voidflame.admin.kits:
    description: Manage the installed kit system.
    default: false
  voidflame.admin.arenas:
    description: Manage the installed arena system.
    default: false
  voidflame.admin.queues:
    description: Manage queues and matchmaking.
    default: false
  voidflame.admin.ffa:
    description: Manage FFA.
    default: false
  voidflame.admin.rewards:
    description: Manage rewards and coins.
    default: false
  voidflame.admin.ranks:
    description: Manage ranks and rank assignments.
    default: false
  voidflame.admin.players:
    description: Manage players through the administration console.
    default: false
  voidflame.admin.menus:
    description: Manage menu integrations.
    default: false
  voidflame.admin.logs:
    description: View/manage administration and system logs.
    default: false
  voidflame.admin.settings:
    description: Manage practice/server settings.
    default: false
  voidflame.admin.security:
    description: Manage security controls.
    default: false
  voidflame.admin.database:
    description: Manage Core database backup/recovery.
    default: false
  voidflame.admin.punishments:
    description: Issue and manage player punishments.
    default: false
  voidflame.admin.metrics:
    description: View server TPS, memory, CPU and runtime metrics.
    default: false
  voidflame.staff:
    description: Staff control access.
    default: op
  voidflame.staff.basic:
    description: Basic staff player tools.
    default: false
  voidflame.staff.manage:
    description: Advanced player state and inventory controls.
    default: false
  voidflame.staff.moderate:
    description: Moderation actions such as clearing inventory/chat.
    default: false
  voidflame.staff.players:
    description: Staff player management access.
    default: op
  voidflame.staff.server:
    description: Staff server management access.
    default: op
  voidflame.staff.world:
    description: Staff world management access.
    default: op
  voidflame.staff.admin:
    description: Staff advanced administration access.
    default: op
