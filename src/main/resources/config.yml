# ================================================================
# VoidFlame Admin • Central Administration Console
# Paper 26.2 • Java 25
# ================================================================

gui:
  title: "&8VoidFlame &5• &dAdministration"
  rows: 6
  filler: "BLACK_STAINED_GLASS_PANE"
  accent: "PURPLE_STAINED_GLASS_PANE"
  page-size: 45

security:
  destructive-confirmation: true
  confirmation-seconds: 15
  audit-actions: true

logging:
  file:
    enabled: true
    path: "logs/admin.log"

settings:
  speed-step: 0.1
  max-speed: 1.0
  clear-chat-lines: 100
  kick-all-except-staff: true

integrations:
  # ZonePractice Pro admin entry points. These commands open its native GUIs/controls;
  # VoidFlame Admin does not duplicate the Practice engine.
  duels:
    command: "setup"
  kits:
    command: "editor"
  arenas:
    command: "arena"
  queues:
    command: "practice"
  ffa:
    command: "practice"
  rewards:
    command: "coinshop"
  ranks:
    command: "ranks"
  menus:
    command: "practice"
  logs:
    command: "vflogs"
  security:
    command: "antibot status"
  settings:
    command: "settings"
  players:
    command: "staffgui"
  worlds:
    command: "vfworld list"
  database:
    command: "vfrestore"
  staff:
    command: "staffgui"

punishments:
  enabled: true
  require-confirmation: true
  history-page-size: 9
  default-reason: "No reason provided"
  hierarchy-enforced: true
  expiry-cleanup-seconds: 30

time-weather:
  lock-time: false
  lock-weather: false
  time: 6000
  storm: false

flags:
  pvp: true
  block-place: true
  mob-spawning: true

messages:
  no-permission: "&cYou do not have permission for this section."
  action-disabled: "&cThis administration action is disabled."
  action: "&aAction completed: &f%action%"
  reload: "&aVoidFlame Admin configuration reloaded."
