# ================================================================
# VoidFlame Admin • Central Administration Console
# Paper 26.2 • Java 25
# ================================================================
# This is the central GUI controller for VoidFlameMC.
# It coordinates VoidFlame-Core/Ranks/Logs/Security and installed
# third-party Practice/Duels/Kits/Arenas/TAB systems.
#
# Persistent VoidFlame data belongs to:
#   plugins/VoidFlame-Core/database.db
#
# IMPORTANT:
# - The Admin plugin does not create duplicate databases.
# - The Admin reload action reloads only this plugin; never use Bukkit /reload.
# - External commands below are intentionally configurable because command
#   names vary by the installed third-party plugin/version.
# - Every destructive action must remain confirmation-protected.

gui:
  title: "&8VoidFlame &5• &dAdministration"
  rows: 6
  filler: "BLACK_STAINED_GLASS_PANE"
  accent: "PURPLE_STAINED_GLASS_PANE"
  page-size: 45

security:
  destructive-confirmation: true
  confirmation-seconds: 15
  audit-actions: true

settings:
  speed-step: 0.1
  max-speed: 1.0
  clear-chat-lines: 100
  kick-all-except-staff: true

# ================================================================
# External system routing
# Change these commands to match the installed third-party plugins.
# Leave a command blank to disable that button.
# ================================================================
integrations:
  duels:
    command: "duels"
  kits:
    command: "kit admin"
  arenas:
    command: "arena"
  queues:
    command: "duels"
  ffa:
    command: "ffa"
  rewards:
    command: "coinshop"
  ranks:
    command: "ranks"
  menus:
    command: "duels"
  logs:
    command: "logs"
  security:
    command: "antibot status"
  settings:
    command: "settings"
  worlds:
    command: "vfworld list"
  database:
    command: "vfrestore"
  staff:
    command: "staffgui"

# ================================================================
# Server controls exposed by Staff GUI
# ================================================================
time-weather:
  lock-time: false
  lock-weather: false
  time: 6000
  storm: false

flags:
  pvp: true
  block-place: true
  mob-spawning: true

messages:
  no-permission: "&cYou do not have permission for this section."
  action-disabled: "&cThis administration action is disabled."
  action: "&aAction completed: &f%action%"
  reload: "&aVoidFlame Admin configuration reloaded."
